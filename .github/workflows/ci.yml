name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm install -g firebase-tools

      - run: npm install
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - run: firebase emulators:exec --project atendeai-teste-local --only auth,firestore,functions "npm --prefix functions test"
        working-directory: .

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build